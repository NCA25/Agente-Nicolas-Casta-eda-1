<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa de mercadeo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F4F0;--ink:#15262B;--mut:#5B6B70;--side:#112B36;--side2:#1A3B48;--sidetx:#DCE8EC;--acc:#1E88A8;--gold:#F0B429;--you:#E2ECEE;--bd:#D5DBD6;
--ui:"Bricolage Grotesque",system-ui,sans-serif;--read:"Source Serif 4",Georgia,serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui)}
.app{display:grid;grid-template-columns:260px 1fr;height:100%}
aside{background:var(--side);color:var(--sidetx);padding:22px 16px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.brand{font-weight:700;font-size:1.25rem;line-height:1.15;margin:0 6px 4px}
.sub{font-size:.82rem;color:#9DB5BD;margin:0 6px 16px}
aside h3{font-size:.8rem;font-weight:500;color:#9DB5BD;margin:14px 6px 4px}
aside button{font:inherit;font-size:.95rem;text-align:left;color:var(--sidetx);background:transparent;border:0;border-radius:8px;padding:9px 10px;cursor:pointer}
aside button:hover{background:var(--side2)}
.grow{flex:1}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.main{display:flex;flex-direction:column;min-width:0;height:100%}
#keybar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 24px;background:#FFF6DC;border-bottom:1px solid #EAD59A;font-size:.92rem}
#keybar[hidden]{display:none}
#keybar input{flex:1;min-width:200px;font:inherit;padding:8px 10px;border:1px solid #C9B574;border-radius:8px;background:#fff}
#keybar a{color:var(--acc)}
.btn{font:inherit;font-weight:700;padding:9px 16px;border:0;border-radius:8px;background:var(--acc);color:#fff;cursor:pointer}
#feed{flex:1;overflow-y:auto;padding:28px 24px}
.col{max-width:760px;margin:0 auto}
.hero h2{font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.1;margin:8vh 0 10px;font-weight:700}
.hero p{color:var(--mut);margin:0 0 22px;font-size:1.05rem}
.starters{display:grid;gap:10px}
.starters button{font:inherit;text-align:left;padding:14px 16px;background:#fff;border:1px solid var(--bd);border-left:4px solid var(--gold);border-radius:8px;cursor:pointer}
.starters button:hover{border-color:var(--acc);border-left-color:var(--acc)}
.starters b{display:block;margin-bottom:2px}
.starters span{color:var(--mut);font-size:.9rem}
.msg{margin:0 0 22px}
.you{margin-left:auto;max-width:85%;background:var(--you);padding:10px 14px;border-radius:12px 12px 2px 12px;width:fit-content}
.bot{font-family:var(--read);font-size:1.06rem;line-height:1.65;max-width:70ch;overflow-wrap:anywhere}
.bot h4{font-family:var(--ui);font-size:1.1rem;margin:20px 0 6px}
.bot p{margin:0 0 12px}.bot ul,.bot ol{margin:0 0 12px;padding-left:22px}
.bot table{border-collapse:collapse;margin:0 0 14px;font-family:var(--ui);font-size:.9rem;display:block;overflow-x:auto}
.bot th,.bot td{border:1px solid var(--bd);padding:6px 10px;text-align:left;vertical-align:top}
.bot th{background:#E8ECE7}
.bot code{background:#E8ECE7;padding:1px 5px;border-radius:4px;font-size:.92em}
.bot a{color:var(--acc)}
.src{font-family:var(--ui);font-size:.85rem;color:var(--mut);border-left:3px solid var(--bd);padding-left:12px;margin-top:14px}
.src ol{margin:4px 0 0;padding-left:18px}
.warn{color:#8A5A00}
.err{font-family:var(--ui);color:#9B2C1F;border-left:3px solid #9B2C1F;padding-left:12px}
.dots span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--acc);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dots span{animation:none}}
form{display:flex;gap:10px;padding:14px 24px 18px;border-top:1px solid var(--bd);background:var(--paper)}
form .col{display:flex;gap:10px;width:100%}
textarea{flex:1;font:inherit;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:#fff;color:var(--ink);resize:none;max-height:160px}
@media (max-width:820px){
 .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
 aside{flex-direction:row;flex-wrap:wrap;padding:12px;gap:4px}
 .brand{width:100%;margin:0}.sub,aside h3,.grow{display:none}
 aside button{font-size:.85rem;padding:6px 9px;background:var(--side2)}
 #feed{padding:18px 14px}form{padding:10px 14px 14px}
}
@media print{aside,form,#keybar{display:none}.app{display:block;height:auto}#feed{overflow:visible}body,html{height:auto}.hero{display:none}}
</style>
</head>
<body>
<div class="app">
<aside>
  <p class="brand">Mesa de mercadeo y ventas</p>
  <p class="sub">Tu agente con fuentes</p>
  <h3>Búsqueda de empleo</h3>
  <button data-q="cv">Revisar hoja de vida</button>
  <button data-q="int">Simulacro de entrevista</button>
  <button data-q="plan">Plan de la semana</button>
  <button data-q="cmp">Informe comparativo</button>
  <div class="grow"></div>
  <h3>Sesión</h3>
  <button id="btnHtml">Descargar como HTML</button>
  <button id="btnPdf">Guardar como PDF</button>
  <button id="btnNew">Nueva conversación</button>
  <button id="btnKey">Cambiar API key</button>
</aside>
<section class="main">
  <div id="keybar" hidden>
    <span>Pega tu API key de Gemini para empezar (<a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">créala gratis aquí</a>). Se guarda solo en este navegador.</span>
    <input id="keyIn" type="password" placeholder="Tu API key" autocomplete="off" aria-label="API key de Gemini">
    <button class="btn" id="keyOk" type="button">Guardar key</button>
  </div>
  <div id="feed"><div class="col" id="log"></div></div>
  <form id="f"><div class="col">
    <textarea id="input" rows="2" placeholder="Escribe tu consulta. Enter envía, Shift+Enter hace salto de línea." aria-label="Tu consulta"></textarea>
    <button class="btn" type="submit">Enviar</button>
  </div></form>
</section>
</div>
<script>
const CONFIG={MODEL:"gemini-3.8-flash",ENDPOINT:"https://generativelanguage.googleapis.com/v1beta/models/",USE_SEARCH:true,TEMPERATURE:0.4,KEY:"agente_mercadeo_gemini_key"};
const SYSTEM_PROMPT=`
# ROL
Eres un experto en Mercadeo (marketing estratégico y digital) y Ventas (B2B y B2C), y mentor de carrera de Nicolas.
# PERFIL DE NICOLAS
Estudiante de Administración de Empresas con especialización en marketing estratégico. Busca empleo de nivel junior en mercadeo digital. Experiencia: ventas B2B y trade marketing (Electrolit) y ventas B2C (MetLife). Es calmado, analítico, crítico, abierto a equivocarse y le gusta comparar varias opciones e ideas multidisciplinares.
# ESTILO
- Español, tuteando, llámalo "Nicolas". Directo, claro, cordial, sin rodeos.
- Anglicismos formales solo cuando hagan falta (KPI, funnel, ATS, buyer persona...) y explícalos brevemente.
- Explica cifras con palabras simples. Di explícitamente cuándo no estés seguro.
# REGLA DE FUENTES (la más importante)
- Toda recomendación o dato debe apoyarse en una fuente oficial y seria (universidades, organismos, informes reconocidos, documentación oficial).
- Nunca inventes datos, cifras, estudios, empresas, URLs ni citas. Si no tienes fuente verificable, escribe: "No tengo una fuente verificable para esto".
- Cita el nombre de la fuente en el texto. Separa siempre dato con fuente de opinión tuya.
# MÉTODO (para cada tema)
1. Qué haría la IA (con fuentes). 2. Qué haría un profesional del tema. 3. Qué haría Nicolas (predictivo, según su perfil). 4. Conexión con Mercadeo y Ventas. 5. Siguiente paso concreto.
Si la pregunta es simple, responde corto y salta pasos que no aporten.
# ENFOQUE ACTUAL
Búsqueda de empleo: hoja de vida, LinkedIn, portafolio, vacantes, entrevista (preguntas, simulacros, método STAR) y qué tipo de empleo le conviene. Dile qué mejorar, corregir, añadir o eliminar, con pauta detallada.
# ENTREGABLES
Informes comparativos, resumen semanal de búsquedas y cómo se relacionan, cómo mejorar la búsqueda y una sugerencia para la semana siguiente. Usa encabezados claros para exportar.
# LÍMITES
No des consejo legal, médico o financiero como definitivo. No pidas datos sensibles (cédula, contraseñas).
`;
const STARTERS={
 cv:["Revisar hoja de vida","Qué mejorar, corregir, añadir y eliminar para roles junior de mercadeo digital.","Quiero que revises mi hoja de vida para roles junior de mercadeo digital. Dime qué mejorar, corregir, añadir y eliminar. Pídeme el texto de mi hoja de vida si lo necesitas."],
 int:["Simulacro de entrevista","Una pregunta a la vez, con retroalimentación.","Hazme un simulacro de entrevista para un cargo junior de marketing digital. Una pregunta a la vez y dame retroalimentación después de cada respuesta."],
 plan:["Plan de la semana","Acciones concretas para tu búsqueda de empleo.","Dame un plan para esta semana de mi búsqueda de empleo en mercadeo digital, con acciones concretas y cómo medir si avanzo."],
 cmp:["Informe comparativo","Compara dos rutas de carrera con fuentes.","Hazme un informe comparativo entre trabajar en marketing digital en una agencia y en el área de marketing de una empresa, para alguien con poca experiencia. Cita fuentes."]};
const $=id=>document.getElementById(id),log=$("log"),feed=$("feed"),input=$("input");
let history=[],busy=false;
const store={get:()=>{try{return localStorage.getItem(CONFIG.KEY)||""}catch(e){return""}},set:v=>{try{localStorage.setItem(CONFIG.KEY,v)}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inl=s=>s.replace(/`(.+?)`/g,"<code>$1</code>").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
function md(src){
 const L=esc(src).split("\n");let o="",i=0;
 while(i<L.length){
  const l=L[i];
  if(/^\s*$/.test(l)){i++;continue}
  let m;
  if((m=l.match(/^#{1,4}\s+(.*)/))){o+=`<h4>${inl(m[1])}</h4>`;i++;continue}
  if(/^\s*\|/.test(l)){const rows=[];while(i<L.length&&/^\s*\|/.test(L[i])){rows.push(L[i]);i++}
   const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>inl(c.trim()));
   const body=rows.filter(r=>!/^\s*\|?[\s:|-]+\|?\s*$/.test(r));
   o+="<table>"+body.map((r,k)=>"<tr>"+cells(r).map(c=>k?`<td>${c}</td>`:`<th>${c}</th>`).join("")+"</tr>").join("")+"</table>";continue}
  if(/^\s*[-*]\s+/.test(l)){o+="<ul>";while(i<L.length&&/^\s*[-*]\s+/.test(L[i])){o+=`<li>${inl(L[i].replace(/^\s*[-*]\s+/,""))}</li>`;i++}o+="</ul>";continue}
  if(/^\s*\d+[.)]\s+/.test(l)){o+="<ol>";while(i<L.length&&/^\s*\d+[.)]\s+/.test(L[i])){o+=`<li>${inl(L[i].replace(/^\s*\d+[.)]\s+/,""))}</li>`;i++}o+="</ol>";continue}
  const p=[];while(i<L.length&&!/^\s*$/.test(L[i])&&!/^(#{1,4}\s|\s*\||\s*[-*]\s|\s*\d+[.)]\s)/.test(L[i])){p.push(L[i]);i++}
  o+=`<p>${inl(p.join("<br>"))}</p>`;
 }
 return o;
}
function add(cls,html){const d=document.createElement("div");d.className="msg "+cls;d.innerHTML=html;log.appendChild(d);feed.scrollTop=feed.scrollHeight;return d}
function sources(ch){
 const seen=new Set();
 const it=ch.filter(c=>c&&c.uri&&c.uri.startsWith("https://")&&!seen.has(c.uri)&&seen.add(c.uri)).map(c=>`<li><a href="${esc(c.uri)}" target="_blank" rel="noopener noreferrer">${esc(c.title||c.uri)}</a></li>`);
 return it.length?`<div class="src"><b>Fuentes consultadas</b><ol>${it.join("")}</ol></div>`:`<div class="src warn">Esta respuesta llegó sin fuentes de búsqueda. Verifica los datos antes de usarlos.</div>`;
}
function hello(){
 log.innerHTML=`<div class="hero"><h2>¿Qué trabajamos hoy, Nicolas?</h2><p>Cito fuentes y te digo cuándo no estoy seguro.</p><div class="starters">`+
 Object.keys(STARTERS).map(k=>`<button type="button" data-q="${k}"><b>${STARTERS[k][0]}</b><span>${STARTERS[k][1]}</span></button>`).join("")+`</div></div>`;
}
function checkKey(){$("keybar").hidden=!!store.get()}
async function ask(text){
 if(busy)return;
 if(!store.get()){checkKey();$("keyIn").focus();return}
 busy=true;
 const h=log.querySelector(".hero");if(h)h.remove();
 add("you",esc(text).replace(/\n/g,"<br>"));
 history.push({role:"user",parts:[{text}]});
 const w=add("bot",'<span class="dots"><span></span><span></span><span></span></span>');
 const body={systemInstruction:{parts:[{text:SYSTEM_PROMPT}]},contents:history,generationConfig:{temperature:CONFIG.TEMPERATURE}};
 if(CONFIG.USE_SEARCH)body.tools=[{google_search:{}}];
 try{
  const call=async b=>{const r=await fetch(CONFIG.ENDPOINT+CONFIG.MODEL+":generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":store.get()},body:JSON.stringify(b)});return{r,d:await r.json()}};
  let {r,d}=await call(body),searched=!!body.tools;
  if(!r.ok&&searched&&(r.status===400||r.status===403||/search|ground|tool/i.test((d.error&&d.error.message)||""))){
   delete body.tools;searched=false;({r,d}=await call(body));
  }
  if(!r.ok)throw new Error(d.error&&d.error.message?d.error.message:"Error "+r.status);
  const c=d.candidates&&d.candidates[0];
  const out=((c&&c.content&&c.content.parts)||[]).map(p=>p.text||"").join("");
  if(!out)throw new Error("La respuesta llegó vacía (puede ser un bloqueo de seguridad). Reformula la pregunta.");
  history.push({role:"model",parts:[{text:out}]});
  const ch=((c.groundingMetadata&&c.groundingMetadata.groundingChunks)||[]).map(x=>x.web);
  w.innerHTML=md(out)+(searched?sources(ch):'<div class="src warn">Tu plan o modelo no permitió la búsqueda web, así que esta respuesta NO trae fuentes. Verifica cada dato antes de usarlo.</div>');
 }catch(e){
  history.pop();w.className="msg err";
  w.innerHTML="No pude responder: "+esc(e.message)+"<br>Si dice 429, llegaste al límite gratuito: espera unos minutos. Si menciona la API key, usa «Cambiar API key».";
 }
 busy=false;feed.scrollTop=feed.scrollHeight;
}
function send(){const t=input.value.trim();if(!t)return;input.value="";ask(t)}
document.addEventListener("click",e=>{const b=e.target.closest("[data-q]");if(b&&STARTERS[b.dataset.q]){input.value=STARTERS[b.dataset.q][2];input.focus()}});
$("f").addEventListener("submit",e=>{e.preventDefault();send()});
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
$("keyOk").onclick=()=>{const v=$("keyIn").value.trim();if(v){store.set(v);$("keyIn").value="";checkKey();input.focus()}};
$("keyIn").addEventListener("keydown",e=>{if(e.key==="Enter")$("keyOk").click()});
$("btnKey").onclick=()=>{store.set("");checkKey();$("keyIn").focus()};
$("btnNew").onclick=()=>{history=[];hello()};
$("btnPdf").onclick=()=>window.print();
$("btnHtml").onclick=()=>{
 const css=[...document.querySelectorAll("style")].map(s=>s.textContent).join("\n");
 const doc=`<!DOCTYPE html><html lang="es"><meta charset="UTF-8"><title>Informe</title><style>${css}.app{display:block;height:auto}aside,form,#keybar{display:none}#feed{overflow:visible}body,html{height:auto}</style><body><div class="app"><div class="main"><div id="feed">${log.outerHTML}</div></div></div></body></html>`;
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([doc],{type:"text/html"}));a.download="informe-"+new Date().toISOString().slice(0,10)+".html";a.click();
};
hello();checkKey();
</script>
</body>
</html>
